name: Build Resume (RenderCV)

permissions:
  contents: write  # Required for creating releases
  pages: write
  id-token: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install RenderCV
      run: pip install -r requirements.txt

    - name: Create output directory
      run: mkdir -p dist

    - name: Render CV
      run: |
        cd src
        rendercv render Shreyas_Ragavan_CV.yaml \
          --pdf-path ../dist/Shreyas_Ragavan-Resume.pdf \
          --markdown-path ../dist/README.md

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: resume-documents
        path: dist/*.pdf
        retention-days: 90

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: ./dist

    # - name: Deploy to GitHub Pages
    #   uses: actions/deploy-pages@v4
    #   if: github.ref == 'refs/heads/main'

    - name: Create release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Resume Build ${{ github.run_number }}
        files: dist/Shreyas_Ragavan-Resume.pdf
        generate_release_notes: false
