design:
  theme: orgrendercv
  page:
    size: a4
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: true
    show_top_note: false
  colors:
    body: "rgb(89, 89, 89)"
    name: "rgb(37, 99, 149)"
    headline: "rgb(52, 73, 94)"
    connections: "rgb(52, 73, 94)"
    section_titles: "rgb(37, 99, 149)"
    links: "rgb(22, 160, 133)"
    footer: "rgb(127, 140, 141)"
  typography:
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10pt
      connections: 9pt
    alignment: justified
  header:
    alignment: center
    space_below_name: 0.3cm
    space_below_headline: 0.3cm
    space_below_connections: 0.4cm
    connections:
      show_icons: true
      separator: " | "
      space_between_connections: 0.2cm
      phone_number_format: international
  section_titles:
    type: with_partial_line
    space_above: 0.5cm
    space_below: 0.25cm
  sections:
    space_between_regular_entries: 0.8em
    show_time_spans_in: []
  entries:
    date_and_location_width: 3.5cm
    short_second_row: false
    highlights:
      bullet: "•"
      space_above: 0.12cm
      space_between_items: 0.05cm
  templates:
    footer: "PAGE_NUMBER/TOTAL_PAGES"
    experience_entry:
      main_column: "**POSITION** | COMPANY\nHIGHLIGHTS"
      date_and_location_column: "DATE"
    education_entry:
      main_column: "**DEGREE** AREA, INSTITUTION | LOCATION\nHIGHLIGHTS"
      degree_column: null
      date_and_location_column: "DATE"
